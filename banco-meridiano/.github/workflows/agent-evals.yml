# .github/workflows/agent-evals.yml (extracto conceptual)
name: agent-evals
on: [pull_request]
jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5        # uv no viene en el runner
      - run: uv sync
      - run: uv run pytest tests/unit tests/policy
      - run: uv run python evals/run_component_evals.py --fail-under 0.90
      - run: uv run python evals/run_trajectory_evals.py --fail-under 0.95
      - run: uv run python evals/run_redteam_smoke.py --fail-under 1.0
