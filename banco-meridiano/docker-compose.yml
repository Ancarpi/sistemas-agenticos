# docker-compose.yml --- lo único que hace falta levantar para que el repo
# arranque: un Postgres con pgvector. Nada más: el gateway del 0.5 se levanta
# aparte (su `docker run` está en el libro) y los canales se ejecutan a mano.
#
#   docker compose up -d
#   docker compose exec -T db psql -U meridiano -d banco_meridiano \
#       -v ON_ERROR_STOP=1 < db/schema.sql
#
# Un solo Postgres para las cuatro cosas que el libro guarda ahí: los
# checkpoints del grafo (5.2), el Store de memoria (6.2), el corpus del RAG
# (7.6) y la cola de trabajos del lote nocturno (11.2).

services:
  db:
    # 0.8.0+ lo exige el `CREATE EXTENSION vector` del schema.sql (7.6);
    # el índice HNSW del 7.6 necesita pgvector, no solo Postgres.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: meridiano
      POSTGRES_PASSWORD: meridiano        # local y desechable; el .env real va aparte
      POSTGRES_DB: banco_meridiano
    ports:
      - "5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    # El schema.sql crea el rol `meridiano_app` NOSUPERUSER NOBYPASSRLS
    # porque la RLS del 7.6 y del 16.6 no vale nada si la aplicación se
    # conecta como superusuario. El DATABASE_URL de tu .env tiene que usar
    # ESE rol, no el `meridiano` de arriba.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridiano -d banco_meridiano"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos:
