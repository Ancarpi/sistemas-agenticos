# mapeo.yaml --- la UNICA fuente del mapeo libro.md -> banco/.
# Lo aplica tools/extraer_banco/extraer_banco.py. Se edita aqui, nunca
# en el arbol generado. Cada bloque declara sus dos anclas: si el libro se
# mueve, la extraccion falla en voz alta en vez de escribir basura, y
# --resincronizar reubica los rangos por ancla.
#
# modo:
#   verbatim   crea el destino con sus bloques concatenados en orden del libro
#   patch      anade bloques a un destino ya creado, con un marcador de modulo
#   plantilla  escribe un andamio de plantillas/ (no sale del libro)
#   fragmento  incrusta el bloque en COSTURAS.md, para las costuras manuales
#
# bloques: rangos de lineas de CONTENIDO (sin las vallas ```), 1-indexado.

libro_lineas: 12546
# Lo que el libro deja a proposito para el lector, con el sitio donde lo declara.
# `imports.py` las lee de aqui: una laguna declarada no es un import roto, y
# distinguirlas es lo que hace que un import roto DE VERDAD se vea.
