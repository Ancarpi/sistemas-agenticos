# schemas/production-checklist.yaml
# The ten areas that stand between a working agent and a production agent,
# item by item, so a script can count what is missing.
# Origen: A·F (the areas and their items, verbatim in substance), M30.1 (the
# seven roles that sign), M30.3 (which changes need a committee).
#
# `blocking: true` marks the items whose absence is not recoverable by a later
# patch - an irreversible action with no approval, memory with no expiry, a
# corpus with no permissions. `owner_role` is the role from M30.1 that signs,
# by name and date. Criterion for use:
# knowledge/protocols/production-checklist.md.

version: 1

# M30.1 - central platform team plus domain squads. The signature is what
# turns a tick into an accepted responsibility.
owner_roles:
  agent_product_owner: Value, scope, UX, escalation and KPIs
  agent_engineer: Graph, tools, state, integration
  evaluation_engineer: Datasets, metrics, CI gates
  ai_sre: Operation, SLOs, incidents, cost
  security_risk_partner: Threat model, permissions, compliance
  knowledge_owner: Corpus, currency, provenance
  human_ops_lead: Human queues, review, feedback

areas:
  - area: arquitectura
    criterion: knowledge/patterns/tool-capability.md
    items:
      - id: arq.agent_package
        item: Agent Package complete
        owner_role: agent_engineer
        blocking: true
      - id: arq.diagrama_confianza
        item: Diagram with trust boundaries
        owner_role: security_risk_partner
        blocking: false
      - id: arq.adrs
        item: ADRs of the critical decisions
        owner_role: agent_engineer
        blocking: false

  - area: herramientas
    criterion: knowledge/patterns/tool-capability.md
    items:
      - id: tools.esquemas_estrictos
        item: Strict schemas
        owner_role: agent_engineer
        blocking: true
      - id: tools.idempotencia
        item: Idempotency
        owner_role: agent_engineer
        blocking: true
      - id: tools.errores_utiles
        item: Useful errors - typed, compact, actionable
        owner_role: agent_engineer
        blocking: false
      - id: tools.owner
        item: Owner
        owner_role: agent_product_owner
        blocking: true
      - id: tools.tests
        item: Tests
        owner_role: agent_engineer
        blocking: true
      - id: tools.scopes
        item: Scopes
        owner_role: security_risk_partner
        blocking: true
      - id: tools.dryrun_commit
        item: dry-run and commit separated
        owner_role: agent_engineer
        blocking: true

  - area: rag_conocimiento
    criterion: knowledge/patterns/knowledge-governance.md
    items:
      - id: rag.metadatos
        item: Metadata
        owner_role: knowledge_owner
        blocking: false
      - id: rag.acls
        item: ACLs
        owner_role: security_risk_partner
        blocking: true
      - id: rag.recall_at_k
        item: Recall@k evaluation
        owner_role: evaluation_engineer
        blocking: true
      - id: rag.citas
        item: Citations
        owner_role: knowledge_owner
        blocking: false
      - id: rag.frescura
        item: Freshness
        owner_role: knowledge_owner
        blocking: false
      - id: rag.plan_reindexacion
