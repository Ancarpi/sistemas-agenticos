# tools/bloquear_tarjeta.capability.yaml
name: bloquear_tarjeta
version: 1.2.0
owner: core-cards-platform
risk_tier: L4   # el peldaño del Anexo H
intent: "bloquear temporalmente una tarjeta reportada como robada"
auth:
  subject_required: authenticated_customer
  scopes: [cards:block]
  # Aquí, y no bajo `preconditions:`, que es prosa para el
  # revisor: este es el eje que el catálogo del 20.4 compara con
  # el sujeto en cada llamada.
  identity_level: 2
# Los dos ejes que el catálogo del 20.4 compara con el CONTEXTO
# y no con el sujeto. Sin ellos escritos, `_cabe` los leía con
# `.get` y cuatro de sus seis ramas no recortaban nada. Un
# `disponibilidad` vacío quiere decir «en todas partes» y un
# `coste_eur` a cero, «gratis»: las dos son respuestas, y por eso
# el catálogo exige la clave y deja libre el valor.
disponibilidad:
  jurisdiccion: [ES]
  estado_caso: [abierta, en_revision]
  proposito: [fraude, atencion_cliente]
coste_eur: 0.02        # lo que factura la llamada al core (29.4)
preconditions:
  - card_status in [active, suspected_fraud]
  - fraud_signal or explicit_customer_request
effects:
  writes: [core_cards.card_status]
  emits_events: [card.blocked, ticket.created]
idempotency:
  key: "customer_id + masked_pan + reason + day"
  duplicate_behavior: return_existing_result
approval:
  human_required: true
  allowed_approvers: [fraud_ops, cards_ops]
timeouts:
  p95_ms: 1200
  hard_timeout_ms: 4000
audit:
  # Sin este campo, el `clase_y_peldano` del 20.4 la degradaba a
  # `internal` y la política del 26.2 decidía sobre un dato que no
  # era el que tenía delante.
  data_class: confidential
  log_args: masked
  log_result: summary
  pii: [customer_id, masked_pan]
rollback:
  type: compensating_action
  tool: solicitar_desbloqueo_revision
