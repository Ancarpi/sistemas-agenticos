# config/model_routing.yaml
routes:
  triage_low_risk:
    primary: agente-rapido
    fallback: agente-rapido-2
    temperature: 0
    reasoning_effort: low
    max_output_tokens: 300
    eval_gate: triage_accuracy >= 0.92
  supervisor_high_risk:
    primary: agente-listo
    fallback: agente-listo-backup
    reasoning_effort: high
    max_output_tokens: 5000
    eval_gate: route_accuracy >= 0.95 and unsafe_tool_calls == 0
  user_final_answer:
    primary: agente-equilibrado
    fallback: agente-listo
    temperature: 0.2
    reasoning_effort: low
    max_output_tokens: 1200
    eval_gate: faithfulness >= 0.90 and pii_leakage == 0


# --- anadido del M19.6 (extraer_banco) ---
# Anadido del M19.6.
# config/model_routing.yaml --- lo que el 19.2 no declaraba: el
# tope por llamada, el canary, la ruta que no admite degradar y
# los precios (EUR por millón de tokens, entrada y salida). Los
# del ejemplo caducan; los tuyos salen de tu factura.
routes:
  triage_low_risk:            # el resto de claves, las del 19.2
    max_cost_eur: 0.002
    canary: 10                # % de tráfico que va al fallback
  supervisor_high_risk:
    max_cost_eur: 0.12        # 5.000 de salida se comen 0,05
    degradar: false           # antes que bajar de alias, falla
precios:
  agente-rapido:       [0.25, 1.00]
  agente-rapido-2:     [0.25, 1.00]
  agente-equilibrado:  [1.00, 4.00]
  agente-listo:        [2.50, 10.00]
  agente-listo-backup: [2.50, 10.00]
