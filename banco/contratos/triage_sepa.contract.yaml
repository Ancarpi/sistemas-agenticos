# Context Contract del nodo de triaje del banco.
# Origen: M19.1 del libro, la instancia `TRIAGE_CONTRACT`, traducida de la
# dataclass de Python a datos. `isa_validate` lee YAML o JSON y nunca Python:
# lo que se valida es el contrato como dato, no el modulo que lo construye.
# Criterio de uso: knowledge/patterns/context-contract.md
node: triage_sepa
objective: clasificar incidencia sin ejecutar acciones
allowed_state_keys:
  - referencia
  - descripcion_anon
  - eventos
# Segunda barrera, y la que implementa la minimizacion del 16.4: el IBAN y el
# PAN no entran en la llamada aunque alguien los meta en el estado.
forbidden_patterns:
  - '\bES\d{2}(?:[ -]?\d{4}){5}\b'
  - '\b(?:\d[ -]?){16}\b'
# Vacio a proposito: un nodo de triaje clasifica, no actua.
visible_tools: []
output_schema: TriageIncidencia
max_input_tokens: 1200
max_output_tokens: 300
latency_budget_ms: 2000
max_cost_eur: 0.002
fallback: escalate
