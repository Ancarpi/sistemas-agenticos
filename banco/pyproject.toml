# banco --- el repositorio de referencia de «Ingeniería de Sistemas
# Agénticos». Gestor: uv, como en el libro (0.4).
#
#   uv sync                      el núcleo: núcleo, agentes, RAG, MCP
#   uv sync --extra chat         + los canales de chat y Slack (M12, M17)
#   uv sync --extra voz          + teléfono y avatar (M13, M14)
#   uv sync --group dev          + pytest y el linter
#
# Los extras no son cosmética: `voz` arrastra media docena de plugins de
# LiveKit y no hace falta para nada de los módulos 0-12.

[project]
name = "banco"
version = "0.1.0"
description = "Repositorio de referencia del libro «Ingeniería de Sistemas Agénticos» (Antonio Carbonell)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# El `uv add` del 0.4, más el pool y el techo de `mcp` que el 10.2 exige.
#
# Las tres versiones clavadas son las de la tabla del 0.4: las exactas con las
# que se escribió y se ejecutó el código del libro. Se fijan porque el libro usa
# superficie que se mueve con la versión --- `create_agent` en `langchain.agents`
# y el catálogo de `langchain.agents.middleware` (4.1, 4.2), `r.text` como
# propiedad (3.3), el `stream_mode="custom"` del 6.3 ---. Las demás no llevan
# versión a propósito: el libro no da una comprobada para ellas.
dependencies = [
    "langchain==1.3.18",           # 0.4: la versión de la tabla
    "langchain-openai",
    "langgraph==1.2.11",           # 0.4: la versión de la tabla
    "langgraph-checkpoint-postgres",
    "langchain-postgres",
    "langchain-mcp-adapters==0.3.2",  # 10.2: la que resuelve con el techo de abajo
    "langsmith",
    "mcp<2",                       # 10.2: en la rama 2.x FastMCP es MCPServer
    "psycopg[binary,pool]",        # 10.2: el pool que el 0.4 no traía
    "pydantic",
    "python-dotenv",
    "pyyaml",                      # 16.7: tests/test_clasificacion.py
    "ragas",
]

[project.optional-dependencies]
chat = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
]
voz = [
    "livekit-agents==1.7.1",       # 14.2: la versión contra la que se comprobó
    "livekit-plugins-cartesia",
    "livekit-plugins-deepgram",
    "livekit-plugins-langchain",   # 13.4: el puente grafo -> AgentSession
    "livekit-plugins-noise-cancellation",
    "livekit-plugins-silero",
    "livekit-plugins-tavus",
    "livekit-plugins-turn-detector",
]

[dependency-groups]
dev = [
    "pytest>=7",   # 7.0: el `pythonpath` de la seccion de abajo
    "ruff",
]

# El libro coloca el código en src/{core,agents,rag,channels,evals}/ y lo
# importa como `src.core.models` (Ejercicio 0.1), no como un paquete
# instalado. Así que no hay build backend: se ejecuta con el repo en el
# PYTHONPATH. El README dice el comando exacto por fichero.

# `uv run pytest tests/` --- las dos rutas sin las que la coleccion
# muere. El libro escribe los ficheros planos y los importa planos
# (`from cumplimiento import AVISOS`, 16.7), y el Ejercicio 0.1 los
# reparte por `src/`: sin `src/core` aqui, tests/test_art50.py no
# importa, pytest aborta la tanda entera y ejecuta cero tests; y sin
# `plataforma`, tests/test_supresion.py tampoco, porque memoria.py
# importa `trazas` plano (36.6) y ese fichero vive en plataforma/. El
# `.env` lo carga conftest.py, que dice por que si falta.
[tool.pytest.ini_options]
pythonpath = [".", "src/core", "plataforma"]
testpaths = ["tests"]

[tool.uv]
package = false        # proyecto virtual: no se instala, se ejecuta desde el repo
